:root{--bg:#edf3f8;--card:#fff;--ink:#0e3558;--mute:#5b6f82;--land:#dde7ef;--dot:#9fb4c4;--acc:#0e3558;--st:#2bb8f5;--bd:#d3dee8;--gray:#8c9097;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1827;--card:#10263b;--ink:#e8f1f8;--mute:#9bb0c2;--land:#1f3a52;--dot:#58758d;--acc:#3dc2ff;--bd:#21405a;--gray:#3a5368;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Glacial Indifference",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:28px 18px 40px}
.hero{background:#0e3558;padding:calc(26px + env(safe-area-inset-top,0px)) 18px 28px}
.hero div{max-width:1120px;margin:0 auto}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:700;margin:0 0 8px;line-height:1.04;color:#3dc2ff}
.hero p{margin:0;color:#fff}
.sec{background:var(--gray);color:#fff;font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:6px 10px;margin:0 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:920px){.grid{grid-template-columns:1.7fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.map{position:relative;overflow:hidden;align-self:start}
svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:grab}
svg:active{cursor:grabbing}
.c{fill:var(--land);stroke:var(--card);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .3s}
.c.hot{fill:color-mix(in srgb,var(--cc,var(--st)) 62%,var(--land))}
.c:hover{fill:color-mix(in srgb,var(--cc,var(--st)) 85%,var(--land))}
.route{fill:none;stroke:var(--rc);stroke-width:calc(2.6px / var(--z,1));stroke-linecap:round;opacity:0;transition:opacity .35s;pointer-events:none}
.route.past{opacity:.3}.route.on{opacity:1}
.route.draw{stroke-dasharray:var(--len);animation:d 1.1s ease forwards}
@keyframes d{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.all .route{opacity:.55;animation:none;stroke-dasharray:none}
.node{pointer-events:none}
.node circle{fill:var(--dot);r:calc(4.5px / var(--z,1));transition:fill .3s}
.node text{font-size:calc(13px / var(--z,1));fill:var(--ink);font-weight:700;opacity:0;paint-order:stroke;stroke:var(--card);stroke-width:calc(4px / var(--z,1));transition:opacity .3s}
.node.dest circle{fill:var(--card);stroke:var(--nc);stroke-width:calc(2.5px / var(--z,1))}
.node.dest text{opacity:.65}
.node.on circle{fill:var(--nc);stroke:var(--ink);stroke-width:calc(1.5px / var(--z,1));r:calc(7px / var(--z,1))}
.node.on text{opacity:1}
.all .node circle{fill:var(--nc);stroke:none}.all .node text{opacity:0}
.bar{position:absolute;top:10px;display:flex;gap:6px}
.bar.l{left:10px}.bar.r{right:10px}
.bar button{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;min-width:34px}
.bar button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.88rem;line-height:1.3;max-width:220px;opacity:0;transition:opacity .15s}
.tip small{display:block;opacity:.75}
.panel{padding:22px;display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:6px}
.prog button{flex:1;height:8px;padding:0;border:0;border-radius:4px;cursor:pointer}.prog button[aria-current="true"]{height:12px;align-self:center}
.big{font-size:3.2rem;font-weight:700;line-height:1;color:var(--ink);margin:0}.big small{font-size:1.2rem;color:var(--mute)}
h2{font-size:1.55rem;font-weight:700;margin:0;line-height:1.2}
.d{margin:0}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--bd)}
li{border-bottom:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;gap:14px;width:100%;padding:10px 4px;font:inherit;color:inherit;background:none;border:0;text-align:left}
button.row{cursor:pointer}button.row:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.row span{color:var(--mute);text-align:right}
.hint{margin:-6px 0 0;font-size:.85rem;color:var(--mute)}
.row b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--st);margin-right:8px}
.why{margin:0;background:#a8e4fb;color:#0e3558;border-radius:10px;padding:12px 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .why{background:color-mix(in srgb,var(--st) 22%,var(--card));color:var(--ink)}}
.nav{display:flex;gap:8px;margin-top:auto}
.nav button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:10px 14px;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
.nav .next{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav .next,:root:not([data-theme="light"]) .bar button[aria-pressed="true"]{color:#0a1827}}
.nav button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.foot{color:var(--mute);font-size:.85rem;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.route.draw{animation:none}}
</style>
</head>

function zoomTo(cx,cy,z){z=Math.max(1,Math.min(8,z));const w=1000/z,hh=H/z;go({x:cx-w/2,y:cy-hh/2,w,h:hh})}
const zf=f=>zoomTo(vb.x+vb.w/2,vb.y+vb.h/2,1000/vb.w*f);
zi.onclick=()=>zf(1.6);zo.onclick=()=>zf(1/1.6);zr.onclick=()=>zoomTo(500,H/2,1);
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}});
addEventListener("pointerup",()=>drag=null);
svg.addEventListener("pointermove",e=>{
const r=svg.getBoundingClientRect();
if(drag&&vb.w<1000){cancelAnimationFrame(raf);const v=clamp({...vb,x:drag.vx-(e.clientX-drag.x)*vb.w/r.width,y:drag.vy-(e.clientY-drag.y)*vb.h/r.height});vb=v;setVB()}
const c=e.target.closest(".c");if(!c){tip.style.opacity=0;return}
const ro=S.filter(s=>s.c.includes(c.dataset.a)).map(s=>s.t);
tip.innerHTML=`<b>${c.dataset.n}</b>${ro.length?`<small>${ro.join(", ")}</small>`:""}`;
const m=mc.getBoundingClientRect();tip.style.left=Math.min(e.clientX-m.left+14,m.width-230)+"px";tip.style.top=(e.clientY-m.top+14)+"px";tip.style.opacity=1});
svg.addEventListener("pointerleave",()=>tip.style.opacity=0);
function stop(){if(timer){clearInterval(timer);timer=null;pl.textContent="Reproduzir"}}
function sel(i,keep){if(!keep)stop();k=i;const s=S[i];document.documentElement.style.setProperty("--st",COL[i]);
svg.classList.toggle("all",ov);ovb.setAttribute("aria-pressed",ov);
cs.forEach(c=>{const f=S.findIndex(x=>x.c.includes(c.dataset.a)),on=ov?f>=0:s.c.includes(c.dataset.a);c.classList.toggle("hot",on);c.style.setProperty("--cc",COL[ov?f:i])});
N.forEach((n,j)=>{const g=document.getElementById("n"+j);g.classList.toggle("on",n[3]==i);g.classList.toggle("dest",n[3]!=i&&R.some(r=>r[2]==i&&r[1]==j))});
R.forEach((r,j)=>{const e=document.getElementById("r"+j);e.classList.remove("draw","on","past");
if(r[2]==i){e.classList.add("on");e.onanimationend=()=>e.classList.remove("draw");if(!ov){e.style.setProperty("--len",e.getTotalLength());void e.getBoundingClientRect();e.classList.add("draw")}}
else if(r[2]<i)e.classList.add("past")});
panel.innerHTML=`<div class="prog">${S.map((x,j)=>`<button data-i="${j}" aria-label="Etapa ${j+1}: ${x.t}" style="background:${COL[j]};opacity:${j<=i?1:.3}" ${j==i?'aria-current="true"':""}></button>`).join("")}</div>
<p class="big">${i+1}<small> / ${S.length}</small></p><h2>${s.t}</h2><p class="d">${s.d}</p>
<ul>${s.p.map(x=>`<li>${x[2]==null?`<div class="row"><b>${x[0]}</b><span>${x[1]}</span></div>`:`<button class="row" data-n="${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></button>`}</li>`).join("")}</ul>
<p class="hint">Clique em um item da lista para aproximar o mapa.</p><p class="why">${s.w}</p>
<div class="nav"><button id="pv" ${i==0?"disabled":""}>Anterior</button><button class="next" id="nx">${i==S.length-1?"Recomeçar":"Próxima etapa"}</button></div>`;
panel.querySelectorAll(".prog button").forEach(b=>b.onclick=()=>{ov=false;sel(+b.dataset.i)});
panel.querySelectorAll("button.row").forEach(b=>b.onclick=()=>{const n=N[+b.dataset.n];zoomTo(n[1],n[2],3.2)});
pv.onclick=()=>{ov=false;sel(k-1)};
nx.onclick=()=>{ov=false;sel(k==S.length-1?0:k+1)};
if(!keep)zoomTo(500,H/2,1)}
ovb=document.getElementById("ov");
ovb.onclick=()=>{ov=!ov;stop();sel(k);if(ov)zoomTo(500,H/2,1)};
pl.onclick=()=>{if(timer){stop();return}ov=false;pl.textContent="Pausar";sel(0,true);zoomTo(500,H/2,1);
timer=setInterval(()=>{if(k>=S.length-1){stop();return}sel(k+1,true)},4200)};
setVB();sel(0);
</script>
</body>
</html>
